[package]
name = "lightcraft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version = "1.98"
default-run = "lightcraft-desktop"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
qa-native = ["dep:rightkit-qa"]

[lints]
workspace = true

[dependencies]
lightcraft-desktop-host = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { workspace = true }
tauri = { version = "=2.12.4" }
# Updater plugin: same Tauri minor and suite signing key as GenRight (tauri-plugin-updater 2.14.0 on tauri 2.12.4).
tauri-plugin-updater = { version = "=2.14.0" }
rightkit-tauri-shell = { version = "=0.3.0", default-features = false, features = ["wv2-0_39"] }
rightkit-qa = { version = "=0.6.1", default-features = false, features = ["control", "wv2-0_39"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.build-dependencies]
tauri-build = "=2.7.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
rightkit-qa = "=0.6.1"
lightcraft-tiff = { workspace = true }
png = { workspace = true }
