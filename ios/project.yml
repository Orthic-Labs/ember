# Ember native iOS/iPad app shell (library + non-destructive photo editing).
# Generated project is XcodeGen output (gitignored). On a Mac:
#   scripts/ios/build-xcframework.sh   # Rust engine -> ios/Frameworks/EmberCore.xcframework + Swift bindings
#   cd ios && xcodegen generate
# Windows has no local build; iOS builds run on the Mac (dev profile) or in CI.
# RightKitSwift is the published git-URL pin; never a path dep. Adopt only products that cover
# what Ember does; 0.9.0 (held) brings requireDeviceID options and the licence ContinuityBridge.
# The library index is Ember's Rust catalog, not RightKitDB.
name: Ember
options:
  bundleIdPrefix: com.orthiclabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: "NO"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6KLGD3LLKF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RightKitSwift:
    url: https://github.com/Orthic-Labs/rightkit
    exactVersion: 0.8.1
targets:
  Ember:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthiclabs.ember
        TARGETED_DEVICE_FAMILY: "1,2"
        # Empty until the licence endpoint is ratified; Settings shows "not configured".
        EMBER_LICENSE_BASE_URL: ""
    sources:
      # Includes Ember/Generated/ (UniFFI Swift bindings from scripts/ios/build-xcframework.sh).
      - path: Ember
    dependencies:
      # Rust engine: crates/mobile built by scripts/ios/build-xcframework.sh (run before xcodegen).
      - framework: Frameworks/EmberCore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - package: RightKitSwift
        product: RightKitLicense
      - package: RightKitSwift
        product: RightKitAppleCredentials
      - package: RightKitSwift
        product: RightKitDiagnostics
      - package: RightKitSwift
        product: RightKitStore
    info:
      path: Ember/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        EmberLicenseBaseURL: $(EMBER_LICENSE_BASE_URL)
        NSPhotoLibraryUsageDescription: Ember reads photos you choose so you can browse and edit them in your library.
        NSPhotoLibraryAddUsageDescription: Ember saves your exported photos to your photo library.
  EmberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmberTests
    dependencies:
      - target: Ember
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orthiclabs.ember.tests
  EmberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EmberUITests
    dependencies:
      - target: Ember
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orthiclabs.ember.uitests
        TEST_TARGET_NAME: Ember
schemes:
  Ember:
    build:
      targets:
        Ember: all
    test:
      targets:
        - EmberTests
        - EmberUITests
