[package]
name = "lightcraft-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember preview cache: content hashing, memory LRU, disk thumbnail cache, prioritized job pool (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-raster = { workspace = true }
siphasher = { workspace = true }
jpeg-encoder = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the thumbnail disk cache: size cap, LRU eviction, atomic writes (RightKit disk-cache owner)
rightkit-cache = { version = "=0.2.2", default-features = false }
# publishing a moved thumbnail file and the verified cross-volume copy (RightKit safe-filesystem owner)
rightkit-fs = { version = "=0.4.4", default-features = false, features = ["fs", "digest"] }
