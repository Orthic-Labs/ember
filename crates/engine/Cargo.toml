[package]
name = "lightcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-gpu = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-denoise-core = { workspace = true }
lightcraft-denoise = { workspace = true, optional = true }
lightcraft-denoise-onnx = { workspace = true, optional = true }
lightcraft-meta = { workspace = true }
lightcraft-photo-ai = { workspace = true }
lightcraft-lensdb = { workspace = true }
lightcraft-faces = { workspace = true }
miniz_oxide = { workspace = true }
lightcraft-merge = { workspace = true }
lightcraft-geocode = { workspace = true }
lightcraft-video = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.14", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
base64 = "=0.23.1"
lightcraft-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightcraft-fetch = { workspace = true }
# panic hook and reports for contained panics (RightKit owner of crash-reporting; native only, the web build aborts on panic)
rightkit-crash = { version = "=0.3.0", default-features = false }

[features]
# AI masks (Object / Describe) with MobileSAM, or SAM 3 when installed. Off for the web and CLI builds.
sam = ["dep:lightcraft-segment"]
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime", "lightcraft-gpu/denoise"]
# Opt-in ONNX Runtime (DirectML / CoreML) denoise backend as a third candidate beside the CPU and wgpu runners, behind the same
# agreement check. Native only, off by default, not enabled by the desktop app; the runtime library is loaded from
# LIGHTCRAFT_ONNXRUNTIME_DIR (docs/denoise-qualification.md).
onnx-accel = ["denoise", "dep:lightcraft-denoise-onnx", "lightcraft-denoise-onnx/onnx-accel"]
rawnind-model = ["denoise", "lightcraft-denoise/rawnind-model", "lightcraft-denoise-core/rawnind-model"]

[dev-dependencies]
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
lightcraft-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
lightcraft-tiff = { workspace = true }

[[example]]
name = "denoise_backends"
required-features = ["onnx-accel"]
