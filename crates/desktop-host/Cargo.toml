[package]
name = "lightcraft-desktop-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["sam"]
sam = ["lightcraft-engine/sam"]

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-catalog = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
png = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rightkit-file-watch = { version = "=0.4.1", default-features = false }
# Library backup and restore copies, path containment and plain canonical paths (M8, owner `rightkit-fs`)
rightkit-fs = { version = "=0.4.7", default-features = false, features = ["fs"] }
