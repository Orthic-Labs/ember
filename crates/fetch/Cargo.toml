[package]
name = "lightcraft-fetch"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Ember model downloads: mirrors, resume, pinned SHA-256, over HTTPS in pure Rust (L0)"

[lints]
workspace = true

# downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
log = { workspace = true }
# The owner HTTP client (M17): blocking ureq + rustls with the OS trust store. No optional features.
rightkit-http = { version = "=0.3.0", default-features = false }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The loopback test server is allowed by the owner's `testing` helpers only.
rightkit-http = { version = "=0.3.0", default-features = false, features = ["testing"] }
