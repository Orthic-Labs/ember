[package]
name = "lightcraft-denoise-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember denoise model metadata, Bayer tiling and cache formats (L1; no inference backend)"

[lints]
workspace = true

[features]
default = []
rawnind-model = []

[dependencies]
lightcraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
miniz_oxide = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }

# Native only: whole-file publishing of cache products and extracted models (M8, owner `rightkit-fs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rightkit-fs = { version = "=0.4.4", default-features = false, features = ["fs"] }

[dev-dependencies]
proptest = { workspace = true }
