[package]
name = "lightcraft-segment"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Ember segmentation: MobileSAM (default, Apache-2.0 weights) and SAM 3 (optional) inference in pure Rust (L3)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build has no AI masks)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
lightcraft-fetch = { workspace = true }

# Offline qualification reuses existing production baseline; no new external packages.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-pipeline = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
