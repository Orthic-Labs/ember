[package]
name = "lightcraft-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raw = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# atomic file replacement and temp-file sweeping (RightKit safe-filesystem owner)
rightkit-fs = { version = "=0.4.0", default-features = false, features = ["fs"] }

[dev-dependencies]
lightcraft-geom = { workspace = true }
proptest = { workspace = true }
