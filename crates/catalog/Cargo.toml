[package]
name = "lightcraft-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raw = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# atomic file replacement, exclusive publish, folder sync, file identity (`json` carries FileKey) and
# temp-file sweeping (RightKit safe-filesystem owner)
rightkit-fs = { version = "=0.4.7", default-features = false, features = ["fs", "json", "digest"] }

[dev-dependencies]
lightcraft-geom = { workspace = true }
proptest = { workspace = true }

# fault injection (a write that fails part-way) and sync counts for the write-policy tests; never in a release dependency
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rightkit-fs = { version = "=0.4.7", default-features = false, features = ["fs", "json", "digest", "test-seams"] }
