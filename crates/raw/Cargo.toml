[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jxl-oxide = { workspace = true, optional = true }

# jixel runs threads of its own: no encoder on wasm32 (lossy DNG export returns an error there)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jixel = { workspace = true, optional = true }

[features]
default = ["jxl", "jxl-encode"]
## Lossy JPEG XL DNG output (compression 52546) via jixel (pure Rust encoder).
jxl-encode = ["dep:jixel"]
## JPEG XL compressed DNGs (DNG 1.7, compression 52546) via jxl-oxide (pure Rust, MIT OR Apache-2.0).
jxl = ["dep:jxl-oxide"]

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
zune-jpegxl = { workspace = true }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
