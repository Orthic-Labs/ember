[package]
name = "lightcraft-denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember AI denoise (L1): denoise-model manifests, Bayer packing, tiling and blending, the cache file, and pure-Rust CPU inference"

[lints]
workspace = true

[features]
default = []
runtime = ["dep:faer"]
# Candle NAFNet backend for a model installed as `model.safetensors` + `contract.json` (issue #200). Off by default;
# without it the ONNX path is the only one and behaviour is unchanged.
nafnet = ["dep:lightcraft-nafnet"]
# Product-policy switch: absent by default; users may install their own model.
rawnind-model = ["lightcraft-denoise-core/rawnind-model"]

[dependencies]
lightcraft-denoise-core = { workspace = true }
lightcraft-nafnet = { workspace = true, optional = true }
# Safe matrix views over the pure-Rust GEMM backend; no BLAS, cc/build scripts
# or inner thread pool. Its dependencies include architecture-specific assembly.
faer = { package = "faer-core", version = "=0.17.1", default-features = false, features = ["std"], optional = true }
lightcraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
miniz_oxide = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
