[package]
name = "lightcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ember MCP server (L5): JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Owner-only token file of the control channel (M8, owner `rightkit-fs`)
rightkit-fs = { version = "=0.4.7", default-features = false, features = ["fs"] }
