# RightKit's cargo-deny policy for an app that ships no deny.toml of its own (rightkit-gate class A).
# Based on RightKit packages/release/deny-default.toml; advisory ignores and the craft-libs git source are the only additions.
# zip 7.4.0 (candle-core, read-only use): zip 7.4.0 arrives only through candle-core 0.9.2, which uses ZipArchive to read PyTorch/npz tensor files (pickle.rs, npy.rs) and never calls ZipArchive::extract or ZipStreamReader::extract, so the extract-path flaws are unreachable; the model files are read, not unpacked to disk.
# The licence allow list is RightKit's own (repository deny.toml); the app's own unpublished crates are private.
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib arrives only through tauri's Linux/BSD-gated GTK dependency (tao, wry, webkit2gtk); the Tauri desktop release targets are Windows and macOS only. Invalidated the moment any GTK (Linux or BSD) Tauri target ships." },
  { id = "RUSTSEC-2026-0367", reason = "tauri-plugin-updater 2.14.0 (the latest) requires zip ^4 as an optional Windows-only dependency; the updater installs only bytes returned by its minisign-verified download, so no unsigned archive is ever extracted." },
  { id = "RUSTSEC-2026-0368", reason = "tauri-plugin-updater 2.14.0 (the latest) requires zip ^4 as an optional Windows-only dependency; the updater installs only bytes returned by its minisign-verified download, so no unsigned archive is ever extracted." },
  { id = "RUSTSEC-2026-0369", reason = "tauri-plugin-updater 2.14.0 (the latest) requires zip ^4 as an optional Windows-only dependency; the updater installs only bytes returned by its minisign-verified download, so no unsigned archive is ever extracted." },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
  "MPL-2.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Permissive licences outside the default list, allowed for the one crate that carries each.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-ui is pinned by commit (Cargo.toml workspace.dependencies).
allow-git = ["https://github.com/storytold/craft-libs"]
