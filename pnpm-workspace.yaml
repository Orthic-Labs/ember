# pnpm refuses a package whose provenance trust level dropped; RightKit's own npm releases
# have no provenance, so each exact version Ember uses is excluded (rightkit#791, option A).
# Update this list with every @rightkit/* bump: exact versions only, no ranges or wildcards.
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@rightkit/app-update@0.4.2'
  - '@rightkit/ci@0.3.0'
  - '@rightkit/i18n@0.2.0'
  - '@rightkit/issues-tracker@0.1.0'
  - '@rightkit/legal@0.6.3'
  - '@rightkit/legal-ui@0.4.1'
  - '@rightkit/license@0.3.0'
  - '@rightkit/logs@0.1.6'
  - '@rightkit/onboarding@0.6.3'
  - '@rightkit/platform-ui@0.4.0'
  - '@rightkit/qa@0.6.1'
  - '@rightkit/qa-chrome@0.1.11'
  - '@rightkit/react-shell@0.7.2'
  - '@rightkit/release@0.6.4'
  - '@rightkit/settings-ui@0.7.0'
  - '@rightkit/tauri@0.3.0'
  - '@rightkit/tauri-shell@0.1.3'
  - '@rightkit/theme@0.3.1'

minimumReleaseAgeExclude:
  # Exact versions of every direct @rightkit/* dependency (RightKit publishes without provenance and often within the release-age
  # window). Foundation pins moved to the registry versions 2026-10-24 (Orthic-Labs/ember#240); @rightkit/release stays at 0.6.4
  # until 0.6.5 is published.
  - '@rightkit/app-update@0.4.2'
  - '@rightkit/ci@0.3.0'
  - '@rightkit/i18n@0.2.0'
  - '@rightkit/issues-tracker@0.1.0'
  - '@rightkit/legal@0.6.3'
  - '@rightkit/legal-ui@0.4.1'
  - '@rightkit/license@0.3.0'
  - '@rightkit/logs@0.1.6'
  - '@rightkit/onboarding@0.6.3'
  - '@rightkit/platform-ui@0.4.0'
  - '@rightkit/qa@0.6.1'
  - '@rightkit/qa-chrome@0.1.11'
  - '@rightkit/react-shell@0.7.2'
  - '@rightkit/release@0.6.4'
  - '@rightkit/settings-ui@0.7.0'
  - '@rightkit/tauri@0.3.0'
  - '@rightkit/tauri-shell@0.1.3'
  - '@rightkit/theme@0.3.1'
