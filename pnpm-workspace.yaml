# pnpm refuses a package whose provenance trust level dropped; RightKit's own npm releases
# have no provenance, so each exact version Ember uses is excluded (rightkit#791, option A).
# Update this list with every @rightkit/* bump: exact versions only, no ranges or wildcards.
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@rightkit/app-update@0.4.2'
  - '@rightkit/ci@0.2.45'
  - '@rightkit/issues-tracker@0.1.0'
  - '@rightkit/i18n@0.1.0'
  - '@rightkit/legal-ui@0.4.0'
  - '@rightkit/legal@0.6.1'
  - '@rightkit/license@0.3.0'
  - '@rightkit/logs@0.1.6'
  - '@rightkit/onboarding@0.6.1'
  - '@rightkit/platform-ui@0.4.0'
  - '@rightkit/qa-chrome@0.1.8'
  - '@rightkit/qa@0.5.1'
  - '@rightkit/react-shell@0.7.1'
  - '@rightkit/release@0.6.4'
  - '@rightkit/settings-ui@0.7.0'
  - '@rightkit/tauri-shell@0.1.1'
  - '@rightkit/tauri@0.2.3'
  - '@rightkit/theme@0.3.1'

minimumReleaseAgeExclude:
  - '@rightkit/tauri-shell@0.1.1'
  # RightKit mandatory-set versions published 2026-10-19 (bogusyogi/rightkit #790).
  # Foundation floors raised 2026-10-24 (Orthic-Labs/ember#240): app-update, issues-tracker, license, logs, release, settings-ui.
  - '@rightkit/app-update@0.4.2'
  - '@rightkit/legal@0.6.1'
  - '@rightkit/issues-tracker@0.1.0'
  - '@rightkit/legal-ui@0.4.0'
  - '@rightkit/license@0.3.0'
  - '@rightkit/logs@0.1.6'
  - '@rightkit/onboarding@0.6.1'
  - '@rightkit/platform-ui@0.4.0'
  - '@rightkit/qa@0.5.1'
  - '@rightkit/qa-chrome@0.1.8'
  - '@rightkit/react-shell@0.7.1'
  - '@rightkit/release@0.6.4'
  - '@rightkit/settings-ui@0.7.0'
  - '@rightkit/tauri@0.2.3'
  - '@rightkit/theme@0.3.1'
